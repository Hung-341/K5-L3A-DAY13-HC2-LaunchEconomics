# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm cho mức chênh 5 điểm.
#   b) Theo nhân viên, m = 75: DE=2,48; n=3.103 mỗi nhóm, cần 42 người/nhóm (tổng 84 > 40).
#   c) 20 nhân viên mỗi nhóm: c/ICC=1.000 yêu cầu hiệu dụng tối đa, không đủ 1.251.
#   d) 6 depot mỗi nhóm: c/ICC=300 yêu cầu hiệu dụng tối đa.
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: m=299 yêu cầu/người, DE=6,96; power khoảng 0,64 nếu tác động thật là 5 điểm.
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng làm cùng tuần và cùng depot.
#   2. Chia ngẫu nhiên hay do người chọn: Bốc thăm bằng code với seed ghi trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có nguy cơ chia sẻ gợi ý trong depot; giới hạn quyền theo staff_id và log lượt mở trợ lý.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, chốt trước ngày bắt đầu.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, 20 nhân viên mỗi nhánh.
#
# Đánh đổi đã chấp nhận: MDE 6 điểm thay vì 5; power khoảng 0,64 nếu tác động thực là 5 điểm.
#
# Tỉ lệ mo_lai_trong_7_ngay: 4,25% toàn mẫu, 3,97% trong scope; chênh lệch tối đa +2 điểm so với đối chứng và trần 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"                      # một người có tên vai trò, không ghi "cả đội"
  scope: "Chỉ noi_dia và hang_nang (0,22x và 0,69x so với 12.000 đ, simulated); loại quoc_te (1,88x) và doi_tac (0,85x)."                      # loại yêu cầu nào, depot nào; dựa vào kết quả A3
  assignment:
    unit: "staff"                     # request | staff | depot
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96            # 1 nếu chia theo yêu cầu
    clusters_per_arm: 20         # để trống nếu chia theo yêu cầu
  identifiability:
    concurrent_control: "Có, nhóm đối chứng gồm 20 nhân viên làm cùng thời gian với 20 nhân viên dùng trợ lý."
    spillover_risk: "Có nguy cơ chia sẻ câu trả lời trong depot; giới hạn quyền theo staff_id và ghi log lượt mở trợ lý."
    predeclared: "Chốt chỉ số chính, ngưỡng, luật dừng và ngày quyết định trước ngày bắt đầu."
  stop_rules:
    - "NẾU tỉ lệ mở lại 7 ngày của nhánh trợ lý cao hơn đối chứng ít nhất 2 điểm phần trăm hoặc vượt 6%, hoặc có ít nhất 1 ca hoàn trùng TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút KHÔNG THÌ không được chuyển sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công vượt 8.000 đ TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp về noi_dia và giới hạn 2 lần chạy KHÔNG THÌ không được mở hang_nang"
    - "NẾU tỉ lệ bỏ qua gợi ý vượt 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày KHÔNG THÌ không được chuyển bước rollout"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bấm cờ tắt, hiệu lực trong 30 phút; khách được phục vụ bằng luồng nhân viên tự làm."                   # ai bấm, mất bao lâu, khách được phục vụ bằng gì
  decision_date: "2027-01-05"
  simulated_inputs: ["Dữ liệu CSV của lab", "Baseline 0,70; MDE 0,06; alpha 0,05; power 0,80; ICC 0,02", "40 nhân viên; 12 depot; 45.000 yêu cầu/tháng; rollout 0,10/0,25/0,50", "A3 cost ratios 0,22x; 0,69x; 1,88x; 0,85x", "Mở lại 4,25% toàn mẫu và 3,97% trong scope; ngưỡng an toàn +2 điểm và 6%", "Stop thresholds: 1 ca hoàn trùng/3 ngày; chi phí 8.000 đ/2 tuần; bỏ qua 40%/tuần; 2 lần chạy; phỏng vấn 5 người/3 ngày; rollback 30 phút", "Phút xem lại/làm lại từ cột *_simulated"]         # liệt kê mọi con số giả lập đã dùng
